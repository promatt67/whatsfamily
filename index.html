<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsFamily</title>
  
  <style>
    /* ========================================== */
    /* STILE BANNER AGGIORNAMENTO                  */
    /* ========================================== */
    #update-banner { 
        display: none; /* Nascosto di default, mostrato da app.js quando c'è un update */
        position: fixed; 
        top: 20px; /* In alto al centro per massima visibilità */
        left: 50%; 
        transform: translateX(-50%); 
        background: #8A2BE2; 
        color: white; 
        padding: 12px 24px; 
        border-radius: 30px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        z-index: 99999; /* Sta sopra a qualsiasi altro elemento/chat */
        align-items: center; 
        gap: 15px; 
        font-weight: bold; 
        font-family: system-ui, -apple-system, sans-serif;
    }

    #update-banner button {
        background: #ffffff;
        color: #8A2BE2;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    #update-banner button:active {
        transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- BANNER AGGIORNAMENTO (IN ALTO A INIZIO BODY)-->
  <!-- ========================================== -->
  <div id="update-banner">
    <span>Nuova versione disponibile!</span>
    <button id="update-btn">Aggiorna 🚀</button>
  </div>

  <!-- Il resto della tua app WhatsFamily (login, chat, ecc.) va qui sotto -->

</body>
</html>
